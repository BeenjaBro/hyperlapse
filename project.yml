name: Hyperlapse
options:
  bundleIdPrefix: com.hyperlapse
targets:
  Hyperlapse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hyperlapse.app
      PRODUCT_NAME: Hyperlapse
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Hyperlapse
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is needed to record stabilized hyperlapse videos."
      INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save videos to Photos."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Save videos to Photos."
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record audio."
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
